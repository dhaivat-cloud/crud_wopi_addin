<div style="padding: 20px">
  <h2>📦 Products</h2>
  <ul>
    <li *ngFor="let product of products" (click)="selectProduct(product)" style="cursor: pointer">
      {{ product.productname }}
    </li>
  </ul>

  <div *ngIf="selectedProduct">
    <h3>Groups in {{ selectedProduct.productname }}</h3>
    <ul>
      <li *ngFor="let group of selectedProduct.groups" (click)="selectGroup(group)" style="cursor: pointer">
        {{ group.groupname }}
      </li>
    </ul>

    <input [(ngModel)]="newGroupName" placeholder="New group name" />
    <button (click)="addGroup()">Add Group</button>
  </div>

  <div *ngIf="selectedGroup">
    <h4>Labels in {{ selectedGroup.groupname }}</h4>
    <ul>
      <li *ngFor="let label of selectedGroup.labels">
        {{ label.label }} ({{ label.displayName }}) - {{ label.description }}
      </li>
    </ul>

    <input [(ngModel)]="newLabel.label" placeholder="Label" />
    <input [(ngModel)]="newLabel.displayName" placeholder="Display Name" />
    <input [(ngModel)]="newLabel.description" placeholder="Description" />
    <button (click)="addLabel()">Add Label</button>
  </div>
</div>
